version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: teknofest_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  chatbot:
    build: .
    container_name: teknofest_chatbot
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data: