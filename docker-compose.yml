services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RAGNROLL_CORS_ORIGINS: ${RAGNROLL_CORS_ORIGINS:-http://localhost:3000}
      RAGNROLL_DB_PATH: /app/runtime/ragnroll.sqlite3
      RAGNROLL_RUNTIME_ROOT: /app/runtime
      RAGNROLL_BOOTSTRAP_DATASET: /app/bootstrap/campaigns.json
      RAGNROLL_CHROMA_ENABLED: ${RAGNROLL_CHROMA_ENABLED:-true}
      RAGNROLL_CHROMA_AUTO_INDEX: ${RAGNROLL_CHROMA_AUTO_INDEX:-true}
      RAGNROLL_NLP_AUTO_ENRICH: ${RAGNROLL_NLP_AUTO_ENRICH:-true}
      RAGNROLL_NLP_MAX_RECORDS: ${RAGNROLL_NLP_MAX_RECORDS:-0}
      RAGNROLL_NLP_MANIFEST: ${RAGNROLL_NLP_MANIFEST:-/app/models/final_training/runtime_manifest.json}
      RAGNROLL_CHROMA_PATH: /app/chroma_db
      RAGNROLL_CHROMA_COLLECTION: ${RAGNROLL_CHROMA_COLLECTION:-katilim_bankaciligi_qwen3}
      RAGNROLL_EMBEDDING_MODEL: ${RAGNROLL_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      RAGNROLL_EMBEDDING_BATCH_SIZE: ${RAGNROLL_EMBEDDING_BATCH_SIZE:-4}
      RAGNROLL_EMBEDDING_WARMUP: ${RAGNROLL_EMBEDDING_WARMUP:-true}
      RAGNROLL_INDEX_BATCH_SIZE: ${RAGNROLL_INDEX_BATCH_SIZE:-64}
      RAGNROLL_INDEX_SMOKE: ${RAGNROLL_INDEX_SMOKE:-false}
      RAGNROLL_GENERATION_PROVIDER_ORDER: ${RAGNROLL_GENERATION_PROVIDER_ORDER:-evren,local,deterministic}
      RAGNROLL_RETRIEVAL_PROVIDER_ORDER: ${RAGNROLL_RETRIEVAL_PROVIDER_ORDER:-evren_qdrant,local_qwen_chroma,bm25_graph}
      RAGNROLL_EVREN_ENABLED: ${RAGNROLL_EVREN_ENABLED:-true}
      RAGNROLL_EVREN_RETRIEVAL_ENABLED: ${RAGNROLL_EVREN_RETRIEVAL_ENABLED:-true}
      RAGNROLL_EVREN_CIRCUIT_FAILURE_THRESHOLD: ${RAGNROLL_EVREN_CIRCUIT_FAILURE_THRESHOLD:-3}
      RAGNROLL_EVREN_CIRCUIT_OPEN_SECONDS: ${RAGNROLL_EVREN_CIRCUIT_OPEN_SECONDS:-30}
      RAGNROLL_EVREN_MAX_PRETOKEN_RETRIES: ${RAGNROLL_EVREN_MAX_PRETOKEN_RETRIES:-1}
      RAGNROLL_SSE_HEARTBEAT_SECONDS: ${RAGNROLL_SSE_HEARTBEAT_SECONDS:-15}
      EVREN_LLM_BASE_URL: ${EVREN_LLM_BASE_URL:-https://evren-llmapi.ssyz.org.tr/v1}
      EVREN_LLM_MODEL: ${EVREN_LLM_MODEL:-llm-fast}
      EVREN_ROUTER_MODEL: ${EVREN_ROUTER_MODEL:-router}
      EVREN_GUARD_MODEL: ${EVREN_GUARD_MODEL:-guard}
      EVREN_EMBEDDING_MODEL: ${EVREN_EMBEDDING_MODEL:-bge-m3-embed}
      EVREN_EMBEDDING_DIMENSIONS: ${EVREN_EMBEDDING_DIMENSIONS:-1024}
      EVREN_CONNECT_TIMEOUT: ${EVREN_CONNECT_TIMEOUT:-5}
      EVREN_READ_TIMEOUT: ${EVREN_READ_TIMEOUT:-1800}
      EVREN_MODELS_CACHE_TTL: ${EVREN_MODELS_CACHE_TTL:-300}
      EVREN_QDRANT_URL: ${EVREN_QDRANT_URL:-https://evren-vektor.ssyz.org.tr}
      EVREN_QDRANT_PORT: ${EVREN_QDRANT_PORT:-443}
      EVREN_QDRANT_PREFIX: ${EVREN_QDRANT_PREFIX:-}
      EVREN_QDRANT_COLLECTION: ${EVREN_QDRANT_COLLECTION:-katilim_campaigns_bge_m3_202608}
      EVREN_QDRANT_TIMEOUT: ${EVREN_QDRANT_TIMEOUT:-600}
      EVREN_API_KEY: ${EVREN_API_KEY:-}
      EVREN_QDRANT_API_KEY: ${EVREN_QDRANT_API_KEY:-}
      RAGNROLL_REFRESH_DATASET: ${RAGNROLL_REFRESH_DATASET:-}
      RAGNROLL_LLM_ENABLED: ${RAGNROLL_LLM_ENABLED:-true}
      RAGNROLL_LLM_BASE_URL: ${RAGNROLL_LLM_BASE_URL:-http://host.docker.internal:8001/v1}
      RAGNROLL_LLM_MODEL: ${RAGNROLL_LLM_MODEL:-gemma4:e4b-mlx}
    volumes:
      - runtime_data:/app/runtime
      - chroma_data:/app/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build:
      context: ./src/dashboard
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  runtime_data:
  chroma_data:
