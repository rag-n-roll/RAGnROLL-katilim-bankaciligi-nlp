name: CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları çek
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Python lint
        run: flake8 src tests --max-line-length=100 --extend-ignore=E203
      - name: Backend testleri
        run: pytest tests/ -q --cov=src --cov-report=term --cov-fail-under=70
      - name: Golden Set değerlendirmesi
        run: |
          python -m src.evaluation.golden \
            data/model_training_data/golden_evaluation_set.jsonl \
            --output /tmp/golden-report.json
          python -c 'import json; p=json.load(open("/tmp/golden-report.json")); assert p["intent"]["exact_match"] >= 0.85; assert p["supported_extraction_fields"]["exact_match"] >= 0.82'

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dashboard
    steps:
      - name: Kodları çek
        uses: actions/checkout@v4
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/dashboard/package-lock.json
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Dashboard lint
        run: npm run lint
      - name: Dashboard build
        run: npm run build

  container-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları çek
        uses: actions/checkout@v4
      - name: Compose sözleşmesini doğrula
        run: docker compose config --quiet
