services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RAGNROLL_CORS_ORIGINS: http://localhost:3000
      RAGNROLL_DB_PATH: /app/runtime/ragnroll.sqlite3
      RAGNROLL_CHROMA_ENABLED: "true"
      RAGNROLL_CHROMA_AUTO_INDEX: "true"
      RAGNROLL_CHROMA_PATH: /app/chroma_db
      RAGNROLL_LLM_ENABLED: "true"
      RAGNROLL_LLM_BASE_URL: ${RAGNROLL_LLM_BASE_URL:-http://host.docker.internal:8001/v1}
      RAGNROLL_LLM_MODEL: ${RAGNROLL_LLM_MODEL:-gemma4:e4b-mlx}
    volumes:
      - runtime_data:/app/runtime
      - chroma_data:/app/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dashboard:
    build:
      context: ./src/dashboard
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  runtime_data:
  chroma_data:
